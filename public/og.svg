<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15131c"/>
      <stop offset="1" stop-color="#0e0c14"/>
    </linearGradient>
    <linearGradient id="brand" x1="120" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e05cc8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="130" r="360" fill="url(#glow)"/>
  <!-- logo mark: gradient kanban glyph -->
  <g transform="translate(96,86)">
    <rect x="0" y="0" width="15" height="52" rx="5" fill="url(#brand)"/>
    <rect x="22" y="0" width="15" height="34" rx="5" fill="url(#brand)" opacity="0.8"/>
    <rect x="44" y="0" width="15" height="44" rx="5" fill="url(#brand)" opacity="0.6"/>
    <text x="82" y="40" font-family="'Sora','Segoe UI',sans-serif" font-size="34" font-weight="700" letter-spacing="7" fill="#fff">KANBO</text>
  </g>
  <!-- headline -->
  <text x="96" y="300" font-family="'Sora','Segoe UI',sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#fff">Plan less.</text>
  <text x="96" y="392" font-family="'Sora','Segoe UI',sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#brand)">Finish more.</text>
  <!-- subhead -->
  <text x="98" y="462" font-family="'Manrope','Segoe UI',sans-serif" font-size="27" font-weight="400" fill="#a9a4b8">The to-do list that plans your day —</text>
  <text x="98" y="500" font-family="'Manrope','Segoe UI',sans-serif" font-size="27" font-weight="400" fill="#a9a4b8">capture in plain English, let AI time-block it around your meetings.</text>
  <!-- faux daily-brief card -->
  <g transform="translate(96,540)">
    <rect x="0" y="0" width="1008" height="1" fill="#2a2733"/>
  </g>
  <g transform="translate(96,558)" font-family="'JetBrains Mono','Menlo',monospace">
    <circle cx="7" cy="14" r="6" fill="#8b5cf6"/>
    <text x="26" y="19" font-size="19" fill="#cfcada">Draft Q3 launch deck</text>
    <text x="330" y="19" font-size="15" fill="#6f6a7d">90m · Deep work · Today</text>
    <rect x="600" y="4" width="42" height="24" rx="7" fill="#8b5cf6" fill-opacity="0.22"/>
    <text x="609" y="21" font-size="15" font-weight="700" fill="#b79cff">98</text>
  </g>
</svg>
