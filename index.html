<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- browser chrome / status bar colour; theme-init.js keeps it in step with the theme -->
    <meta name="theme-color" content="#0B1020" />
    <!-- apply the saved theme before first paint so there's no flash (dark is the
         default). A same-origin file, not an inline script: the CSP (script-src
         'self') blocks inline scripts. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG touch icons; a full-bleed PNG (iOS rounds the corners itself) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kanbo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Kanbo — the to-do list that plans your day</title>
    <meta name="description" content="Kanbo turns scattered tasks into a realistic, time-blocked day. Capture in plain English, let AI prioritise, and focus on what actually matters." />
    <link rel="canonical" href="https://www.kanbo.co.uk/" />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kanbo" />
    <meta property="og:title" content="Kanbo — the to-do list that plans your day" />
    <meta property="og:description" content="Capture in plain English, let AI plan your day around your meetings, and focus on what matters. Built for individuals and teams." />
    <meta property="og:url" content="https://www.kanbo.co.uk/" />
    <meta property="og:image" content="https://www.kanbo.co.uk/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kanbo — plan less, finish more" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kanbo — the to-do list that plans your day" />
    <meta name="twitter:description" content="Capture in plain English, let AI plan your day around your meetings, and focus on what matters." />
    <meta name="twitter:image" content="https://www.kanbo.co.uk/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
